<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sales Pulse Live — Mock Dashboard</title>
  <link rel="stylesheet" href="../css/tokens.css"/>
  <link rel="stylesheet" href="../css/app.css"/>
</head>
<body>
<!--
  Dev harness: loads the real app.html markup + js/main.js against a fake
  Etsy API (test/mock-api.js), so the dashboard can be exercised without
  OAuth. Open http://localhost:8000/test/mock.html
  ?tab=overview|orders|products|customers|finances opens that tab once the dashboard shows;
  ?preset=7d|30d|90d|ytd|1y|all picks a period (handy for headless screenshots).
-->
<script type="module">
import { installMockApi } from './mock-api.js';

const html = await (await fetch('../app.html')).text();
const doc  = new DOMParser().parseFromString(html, 'text/html');
doc.querySelectorAll('script').forEach(s => s.remove());
document.body.append(...doc.body.childNodes);

installMockApi();
const qs = new URLSearchParams(location.search);
sessionStorage.setItem('spl_token',         qs.has('expired') ? '12345.expired' : '12345.mocktoken');
if (qs.has('norefresh')) sessionStorage.removeItem('spl_refresh_token');
else sessionStorage.setItem('spl_refresh_token', '12345.refresh');
window.mockCurrency = qs.get('currency') || 'USD';
sessionStorage.setItem('spl_user_id',       '12345');
sessionStorage.setItem('spl_api_key',       'mockkey');
sessionStorage.setItem('spl_shared_secret', 'mocksecret');

await import('../js/main.js');

// Optional ?preset= / ?tab= switches, clicked once the dashboard is showing
const click = sel => document.querySelector(sel)?.click();
const timer = setInterval(() => {
  if (document.getElementById('dashboard').style.display !== 'block') return;
  clearInterval(timer);
  if (qs.get('preset')) click(`.preset-chip[data-preset="${CSS.escape(qs.get('preset'))}"]`);
  if (qs.get('tab'))    click(`.tab-btn[data-tab="${CSS.escape(qs.get('tab'))}"]`);
}, 50);
</script>
</body>
</html>
